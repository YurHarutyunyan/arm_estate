spring:
  application:
    name: yerevan-homes
  mongodb:
    # directConnection lets the app reach the single-node replica set from outside Docker
    uri: ${MONGODB_URI:mongodb://localhost:27017/yerevan-homes?directConnection=true}
  data:
    mongodb:
      auto-index-creation: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Local development only. Production must set APP_JWT_SECRET (32+ random bytes).
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: ${APP_JWT_TTL:PT2H}
  admin:
    # When both are set, an admin account is created on startup if it doesn't exist
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
