services:
  mongo:
    image: mongo:8
    # Change Streams need a replica set, so Mongo runs as a single-node one
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/yerevan-homes?directConnection=true
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  mongo-data:
  es-data:
