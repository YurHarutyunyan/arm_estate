name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Elasticsearch needs this on Linux hosts; Docker Desktop already sets it
      - run: sudo sysctl -w vm.max_map_count=262144
      # Unit and integration tests; Testcontainers starts real MongoDB and Elasticsearch
      - run: ./mvnw -B verify
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      trace = problem.text or ''
                      # The last "Caused by" lines hold the real reason; the first line is often generic
                      causes = [l.strip() for l in trace.splitlines() if l.strip().startswith('Caused by')]
                      message = ' <- '.join(causes[-3:]) if causes else (problem.get('message') or trace)
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message.replace(chr(10), ' ')[:1500]}")
          PY

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Includes the TypeScript type check
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: sudo sysctl -w vm.max_map_count=262144
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Wait for demo data to be indexed
        run: |
          for i in $(seq 1 60); do
            total=$(curl -fs "http://localhost:3000/api/listings/search?size=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])" || echo 0)
            [ "$total" -ge 300 ] && exit 0
            sleep 2
          done
          echo "Search index has $total listings" && exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend --tail 300
